name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is not redundant: the rename alias guard is only exercised on a
        # case-insensitive filesystem, and it is the project's one invariant.
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m pf_core.guards --root src
      - run: python -m pf_core.guards --root tests
      - run: pytest -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      # the wheel must carry everything the CLI needs to start
      - run: pip install dist/*.whl
      - run: kemperrig --version
      # the sdist must carry everything its own suite needs — tests/_fixture.py is not
      # picked up by setuptools' implicit rules, so this is the guard on MANIFEST.in
      - name: sdist is self-testable
        run: |
          python -m venv /tmp/sdist-venv
          mkdir /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          /tmp/sdist-venv/bin/pip install "/tmp/sdist[dev]"
          cd /tmp/sdist && /tmp/sdist-venv/bin/python -m pytest -q
