# Publishes kemperrig to PyPI when a release tag (v*) is pushed. A name and version can be
# uploaded only once, so `build` checks the tag against pyproject before anything is built.
#
# `build` makes the sdist and wheel and runs twine check; `test` runs the whole CI matrix
# on the same commit; `publish` waits for both and uploads through OIDC trusted publishing,
# so no token lives in the repo. The trusted publisher is registered on pypi.org: owner
# phierceweb, repo kemperrig, workflow publish.yml, environment `pypi`, whose required
# reviewer is the gate before anything reaches PyPI.
name: publish
on:
  push:
    tags: ["v*"]

# Read-only by default; the publish job asks for the OIDC token it needs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      # A tag that disagrees with pyproject's version would otherwise reach PyPI and burn
      # the filename.
      - name: tag matches the package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION != pyproject version $PKG_VERSION — bump pyproject (and CHANGELOG) before tagging"
            exit 1
          fi
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
